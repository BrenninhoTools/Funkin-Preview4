name: Mobile Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
      HXCPP_CACHE_MB: 4096
      NDK_VERSION: 29.0.13113456
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            build-tools;35.0.0
            platforms;android-29
            platforms;android-35
            ndk;29.0.13113456

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup haxelib
        run: |
          haxelib --never --global install haxelib 4.1.0
          haxelib --global set haxelib 4.1.0
          haxelib --never --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies
          haxelib --never --global git hmm https://github.com/FunkinCrew/hmm funkin-patches
          haxelib --never newrepo

      - name: Restore haxelib cache
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-android-${{ hashFiles('hmm.json') }}

      - name: Install dependencies
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: |
          git config --global advice.detachedHead false
          haxelib --global run hmm install -q
          cd .haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml

      - name: Restore hxcpp cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HXCPP_COMPILE_CACHE }}
          key: hxcpp-android-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            hxcpp-android-${{ github.ref_name }}-
            hxcpp-android-

      - name: Restore Lime ndll cache
        id: cache-lime
        uses: actions/cache@v4
        with:
          path: |
            .haxelib/lime/git/ndll/Linux64
            .haxelib/lime/git/ndll/Android
            .haxelib/lime/git/ndll/Android64
          key: lime-ndll-${{ hashFiles('hmm.json') }}-${{ env.NDK_VERSION }}

      - name: Install native dependencies
        if: steps.cache-lime.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libx11-dev libxi-dev libxext-dev libxinerama-dev libxrandr-dev libgl-dev libgl1-mesa-dev libasound2-dev libpulse-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl-dev libdrm-dev libgbm-dev libdecor-0-dev libxcursor-dev libxss-dev libxxf86vm-dev libudev-dev libdbus-1-dev

      - name: Rebuild Lime for Linux
        if: steps.cache-lime.outputs.cache-hit != 'true'
        run: haxelib run lime rebuild linux -64 -release -nocffi

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Rebuild Lime for Android
        if: steps.cache-lime.outputs.cache-hit != 'true'
        run: haxelib run lime rebuild android -release -nocffi -arm64

      - name: Restore keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android-ci-keystore
          key: android-ci-keystore-v1

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android-ci-keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android-ci-keystore/release.keystore
          elif [ ! -f ~/.android-ci-keystore/release.keystore ]; then
            keytool -genkeypair -keystore ~/.android-ci-keystore/release.keystore -alias funkin -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=FNF Preview 4"
          fi

      - name: Populate .env
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          touch .env
          echo "API_NG_APP_ID=${{ secrets.API_NG_APP_ID }}" >> .env
          echo "API_NG_ENC_KEY=${{ secrets.API_NG_ENC_KEY }}" >> .env
          echo "KEYSTORE_PATH=$HOME/.android-ci-keystore/release.keystore" >> .env
          echo "KEYSTORE_ALIAS=${KEYSTORE_ALIAS:-funkin}" >> .env
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}" >> .env

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('hmm.json') }}-${{ github.sha }}
          restore-keys: |
            gradle-android-${{ hashFiles('hmm.json') }}-
            gradle-android-

      - name: Restore Asset Cache
        id: cache-assets
        uses: actions/cache/restore@v4
        with:
          path: ~/asset-store
          key: assets-${{ hashFiles('tools/optimize_assets.py') }}-${{ hashFiles('assets/**/*.png', 'assets/**/*.xml', 'assets/**/*.ogg', 'assets/**/*.json', 'assets/**/*.mp4') }}
          restore-keys: |
            assets-${{ hashFiles('tools/optimize_assets.py') }}-

      - name: Optimize Assets
        run: |
          pip install --quiet --break-system-packages pillow numpy pyoxipng || pip install --quiet pillow numpy pyoxipng
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 tools/optimize_assets.py assets --spritemaps --trim --repack --audio --audio-quality 5 --json --video --remove-junk --report optimize-report.json --no-cache --store ~/asset-store --prune

      - name: Save Asset Cache
        if: steps.cache-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/asset-store
          key: ${{ steps.cache-assets.outputs.cache-primary-key }}

      - name: Restore ASTC cache
        uses: actions/cache@v4
        with:
          path: astc-textures
          key: astc-${{ hashFiles('astc-compression-data.json', 'tools/optimize_assets.py') }}-${{ hashFiles('assets/**/*.png') }}
          restore-keys: |
            astc-${{ hashFiles('astc-compression-data.json', 'tools/optimize_assets.py') }}-
            astc-

      - name: Build
        run: haxelib run lime build android -release -arm64 -DGITHUB_BUILD -DNO_FEATURE_MOBILE_ADVERTISEMENTS -DNO_FEATURE_MOBILE_IAP
        timeout-minutes: 120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Preview4-Android
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Optimize Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimize-report
          path: optimize-report.json
          if-no-files-found: ignore
